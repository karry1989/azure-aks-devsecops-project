trigger:
  branches:
    include:
      - feature/cicd

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: devsecops-dev
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/app/Dockerfile'
  - name: tag
    value: '$(Build.SourceVersion)'

stages:
# -------------------------------------------------------------------------
# STAGE 1: DevSecOps Scans
# -------------------------------------------------------------------------
- stage: SecurityScan
  displayName: 'DevSecOps Security Scans'
  jobs:
  - job: CodeAndIaCScan
    displayName: 'Scan Terraform & Dockerfile'
    steps:
    - checkout: self

    - script: |
        echo "Installing Checkov..."
        pip install checkov
        echo "Running Checkov on Terraform code..."
        checkov -d $(Build.SourcesDirectory)/terraform --soft-fail
      displayName: 'Run Checkov IaC Security Scan'

    - script: |
        echo "Installing Trivy..."
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update && sudo apt-get install -y trivy
        
        echo "Scanning Dockerfile configuration..."
        trivy config $(Build.SourcesDirectory)/app/
      displayName: 'Run Trivy Config Scan'

# -------------------------------------------------------------------------
# STAGE 2: CI (Build & Push to ACR)
# -------------------------------------------------------------------------
- stage: CI
  displayName: 'Continuous Integration'
  dependsOn: SecurityScan
  condition: succeeded()
  jobs:
  - job: BuildAndPush
    displayName: 'Docker Build & Push to ACR'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push via Azure CLI ACR'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          az acr build \
            --registry $(ACR_NAME) \
            --image $(IMAGE_REPOSITORY):$(tag) \
            --image $(IMAGE_REPOSITORY):latest \
            --file $(dockerfilePath) \
            $(Build.SourcesDirectory)/app

# -------------------------------------------------------------------------
# STAGE 3: GitOps (Update Manifest & Trigger Argo CD)
# -------------------------------------------------------------------------
- stage: GitOps
  displayName: 'Update GitOps Repository'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: UpdateManifest
    displayName: 'Update values.yaml and push to Git'
    steps:
    - checkout: self
      persistCredentials: true

    - script: |
        set -e
        git config --global user.email "azdo-pipeline@devsecops.local"
        git config --global user.name "Azure DevOps Pipeline"

        git checkout feature/cicd
        git pull origin feature/cicd

        # Update the image tag in values.yaml with the commit SHA
        sed -i 's/tag: .*/tag: "$(tag)"/g' helm/devsecops-chart/values.yaml

        git add helm/devsecops-chart/values.yaml
        git commit -m "Update image tag to $(tag) [skip ci]"
        git push origin feature/cicd
      displayName: 'Commit and Push Tag to GitHub'